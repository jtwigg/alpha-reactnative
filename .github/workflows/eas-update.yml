# Publishes a JS/asset OTA update to EAS Update.
# The production channel is for TestFlight binaries (no public App Store listing).
# Web deploys stay on Vercel (vercel.json). This workflow never builds or ships web.
name: EAS Update

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret (expo.dev/settings/access-tokens)."
            echo "See the root README → Over-the-air updates."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish EAS Update
        working-directory: packages/reactnative
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          message="${UPDATE_MESSAGE:-ci update}"
          # eas update --message is a single string; collapse newlines from commit bodies
          message="${message//$'\n'/ / }"
          eas update --channel "${{ steps.channel.outputs.name }}" --non-interactive --message "$message"
