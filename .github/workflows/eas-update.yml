# On push to main this decides per commit, using `pnpm check:native`:
#   native inputs unchanged -> publish a JS/asset OTA update (EAS Update)
#   native inputs changed   -> build iOS and auto-submit to TestFlight, then commit the
#                              new fingerprint baseline so later pushes go back to OTA.
# Native changes bump `version` (runtime) in app.config.js, so OTA never reaches an
# older binary. Pull requests and manual runs never build.
# The production channel is for TestFlight binaries (no public App Store listing).
# Web deploys stay on Vercel (vercel.json). This workflow never builds or ships web.
#
# Only EXPO_TOKEN is a required secret. EXPO_PUBLIC_CONVEX_URL and
# EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY come from the channel's build profile env in
# packages/reactnative/eas.json, and the EAS project ID defaults to the one in
# app.config.js. All three are public; a repository secret of the same name
# overrides the default.
name: EAS Update

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/reactnative/**'
      # The app bundles shared modules and the generated API from here.
      - 'packages/server/convex/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas-update.yml'
  pull_request:
    paths:
      - 'packages/reactnative/**'
      - 'packages/server/convex/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-update-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a native build on main when a newer push arrives; queue it instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  crash-guard:
    name: Crash-guard screens
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render screens against a dead Convex backend
        run: pnpm --filter @rn-monorepo/reactnative test:crash-guard

  update:
    name: Publish OTA update
    needs: crash-guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # contents: write lets the native-build path commit the new baseline back to main.
      contents: write
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'production' }}
      DEFAULT_EAS_PROJECT_ID: 45f0cfd7-2b50-4deb-b537-b5e44f76b937
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Add the EXPO_TOKEN repository secret (Settings → Secrets and variables → Actions). Create it at https://expo.dev/settings/access-tokens. No OTA update was published, so TestFlight devices keep their old JS."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve public config
        working-directory: packages/reactnative
        env:
          SECRET_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
          SECRET_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SECRET_EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          profile_env() {
            node -e 'const env = require("./eas.json").build[process.argv[1]]?.env ?? {}; process.stdout.write(env[process.argv[2]] ?? "")' "$CHANNEL" "$1"
          }
          convex_url="${SECRET_CONVEX_URL:-$(profile_env EXPO_PUBLIC_CONVEX_URL)}"
          clerk_key="${SECRET_CLERK_KEY:-$(profile_env EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY)}"
          project_id="${SECRET_EAS_PROJECT_ID:-$DEFAULT_EAS_PROJECT_ID}"
          if [ -z "$convex_url" ] || [ -z "$clerk_key" ]; then
            echo "::error::eas.json build profile \"$CHANNEL\" has no EXPO_PUBLIC_CONVEX_URL / EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY, and no secret overrides them."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_CONVEX_URL=$convex_url"
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk_key"
            echo "EAS_PROJECT_ID=$project_id"
          } >> "$GITHUB_ENV"
          echo "Channel: $CHANNEL"
          echo "Convex: $convex_url ($([ -n "$SECRET_CONVEX_URL" ] && echo secret || echo eas.json))"
          echo "Clerk key: ${clerk_key:0:12}… ($([ -n "$SECRET_CLERK_KEY" ] && echo secret || echo eas.json))"
          echo "EAS project: $project_id ($([ -n "$SECRET_EAS_PROJECT_ID" ] && echo secret || echo default))"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check native fingerprint
        id: native
        run: |
          set +e
          pnpm check:native
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Native fingerprint changed::Native-affecting inputs differ from the last TestFlight baseline. Skipping OTA — cut a new iOS build and run pnpm check:native --write after submit."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::pnpm check:native failed with exit $status"
          exit "$status"

      - name: Publish EAS Update
        if: steps.native.outputs.changed != 'true'
        working-directory: packages/reactnative
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          message="${UPDATE_MESSAGE:-ci update}"
          # eas update --message is a single string; collapse newlines from commit bodies
          message="${message//$'\n'/ / }"
          eas update --channel "$CHANNEL" --non-interactive --message "$message"

      - name: Skip OTA (native changed)
        if: steps.native.outputs.changed == 'true'
        run: echo "Skipped eas update because the native fingerprint changed."

      # Native change on main: build iOS and submit to TestFlight with no human step.
      # Needs EAS credentials for the build (stored remotely) and an App Store Connect
      # API key stored in EAS for the submit; a missing key fails here with EAS's message.
      - name: Build iOS and submit to TestFlight
        id: build
        if: steps.native.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: packages/reactnative
        run: eas build --profile production --platform ios --non-interactive --auto-submit

      - name: Record new native baseline
        if: steps.build.conclusion == 'success'
        run: |
          pnpm check:native --write
          if git diff --quiet -- packages/reactnative/.native-fingerprint.json; then
            echo "Baseline already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/reactnative/.native-fingerprint.json
          git commit -m "Record native fingerprint after TestFlight build [skip ci]"
          git push origin HEAD:main
